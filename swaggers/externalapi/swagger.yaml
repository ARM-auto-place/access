                                    type: "string"
                                    description: "Для отдельного маршрута может быть опущен."
                                    enum:
                                        - "GetRole"
                                    example: "GetRole"
                        example:
                            jsonrpc: "2.0"
                            id: 1
                            method: "GetRole"
                            params:
                                userID: "3c20ad46-90d0-4002-9997-493a900f4ec0"
                required: true
            responses:
                "200":
                    description: "Результат вызова или JSON-RPC-ошибка. Поля result и error взаимоисключающие."
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - type: "object"
                                      required:
                                          - "id"
                                          - "jsonrpc"
                                          - "result"
                                      properties:
                                          id:
                                              description: "ID исходного запроса; может быть строкой, числом или null."
                                              oneOf:
                                                  - type: "string"
                                                  - type: "number"
                                                  - type: "object"
                                                    nullable: true
                                                    enum:
                                                        - null
                                              example: 1
                                          jsonrpc:
                                              type: "string"
                                              example: "2.0"
                                          result:
                                              "$ref": "#/components/schemas/responseExternalAPIGetRole"
