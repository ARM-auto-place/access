                                success:
                                    summary: "Успешный вызов"
                                    value:
                                        jsonrpc: "2.0"
                                        id: 1
                                        result:
                                            role: "manager"
                                ParseError:
                                    summary: "Некорректный JSON. Генератор также использует этот код при ошибке декодирования параметров или версии протокола."
                                    value:
                                        jsonrpc: "2.0"
                                        id: 1
                                        error:
                                            code: -32700
                                            message: "parse error"
                                InvalidRequest:
                                    summary: "Некорректный JSON-RPC-запрос; зарезервированный код протокола."
                                    value:
                                        jsonrpc: "2.0"
                                        id: 1
                                        error:
