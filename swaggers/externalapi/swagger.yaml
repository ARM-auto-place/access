                                          - oneOf:
                                                - "$ref": "#/components/schemas/models.ErrParseError"
                                                - "$ref": "#/components/schemas/models.ErrInvalidRequest"
                                                - "$ref": "#/components/schemas/models.ErrMethodNotFound"
                                                - "$ref": "#/components/schemas/models.ErrInvalidParams"
                                                - "$ref": "#/components/schemas/models.ErrInternalError"
                                                - "$ref": "#/components/schemas/models.ErrRoleNotFound"
