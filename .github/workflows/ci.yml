
name: CI

on:
  push:
    branches:
      - master
      - release-*
    tags:
      - "v*"

  pull_request:
    branches:
      - master
      - release-*

permissions:
  contents: read


jobs:
  go-ci:
    uses: ARM-auto-place/arm-auto-place/.github/workflows/go-ci.yml@master
    with:
      go-version: "1.25"
  
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: go-ci
    permissions:
      contents: read
      packages: write
    uses: ARM-auto-place/arm-auto-place/.github/workflows/docker-build.yml@v1
